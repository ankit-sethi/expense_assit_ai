<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.3px; }
    header span { font-size: 0.8rem; opacity: 0.6; }

    .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

    #ingest-btn, #upload-btn {
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #ingest-btn:hover:not(:disabled) { background: #3451d1; }
    #ingest-btn:disabled, #upload-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    #upload-btn { background: #43aa8b; }
    #upload-btn:hover:not(:disabled) { background: #368a70; }

    #pdf-password {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      color: #fff;
      padding: 6px 10px;
      font-size: 0.78rem;
      width: 170px;
    }
    #pdf-password::placeholder { color: rgba(255,255,255,0.45); }

    #ingest-status {
      font-size: 0.78rem;
      max-width: 320px;
    }
    #ingest-status.ok     { color: #90be6d; }
    #ingest-status.warn   { color: #f8961e; }
    #ingest-status.error  { color: #f72585; }

    #ingest-detail {
      display: none;
      background: #111827;
      border-radius: 8px;
      padding: 14px 20px;
      margin: 0 32px 4px;
      font-size: 0.78rem;
      line-height: 1.7;
    }
    #ingest-detail table { width: 100%; border-collapse: collapse; }
    #ingest-detail td { padding: 3px 8px; vertical-align: top; }
    #ingest-detail td:first-child { white-space: nowrap; color: #aaa; }
    #ingest-detail .ok-row  td:nth-child(2) { color: #90be6d; }
    #ingest-detail .err-row td:nth-child(2) { color: #f72585; }
    #ingest-detail .resolution { color: #f8961e; font-size: 0.74rem; padding-left: 8px; }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 24px 32px 8px;
    }
    .kpi {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .kpi .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: #888; margin-bottom: 6px; }
    .kpi .value { font-size: 1.55rem; font-weight: 700; color: #1a1a2e; }
    .kpi .sub   { font-size: 0.78rem; color: #aaa; margin-top: 3px; }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
      padding: 16px 32px 32px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .card h2 { font-size: 0.85rem; font-weight: 600; color: #555; text-transform: uppercase;
               letter-spacing: 0.5px; margin-bottom: 16px; }
    .card canvas { max-height: 280px; }

    .error { color: #c0392b; font-size: 0.85rem; padding: 8px; }
    .loading { color: #aaa; font-size: 0.85rem; padding: 8px; }

    @media (max-width: 600px) {
      .charts-grid { grid-template-columns: 1fr; padding: 12px 16px 24px; }
      .kpi-row { padding: 16px 16px 4px; }
      header { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Expense Dashboard</h1>
  <div class="header-right">
    <span id="last-updated">Loading…</span>
    <input type="password" id="pdf-password" placeholder="PDF password (optional)" autocomplete="off" />
    <input type="file" id="pdf-file-input" accept=".pdf" multiple style="display:none" onchange="uploadFiles(this.files)" />
    <button id="upload-btn" onclick="document.getElementById('pdf-file-input').click()">&#128196; Upload PDF</button>
    <button id="ingest-btn" onclick="ingestFiles()">&#8679; Ingest New Files</button>
    <span id="ingest-status"></span>
  </div>
</header>
<div id="ingest-detail"></div>

<div class="kpi-row">
  <div class="kpi"><div class="label">Total Spend (all time)</div><div class="value" id="kpi-total">—</div><div class="sub" id="kpi-txns">— transactions</div></div>
  <div class="kpi"><div class="label">This Month Spend</div><div class="value" id="kpi-month">—</div><div class="sub" id="kpi-month-txns">— transactions</div></div>
  <div class="kpi"><div class="label">Top Category</div><div class="value" id="kpi-top-cat">—</div><div class="sub" id="kpi-top-cat-amt">—</div></div>
  <div class="kpi"><div class="label">Top Merchant</div><div class="value" id="kpi-top-merch">—</div><div class="sub" id="kpi-top-merch-amt">—</div></div>
</div>

<div class="charts-grid">
  <div class="card">
    <h2>Monthly Spend Trend</h2>
    <canvas id="chart-monthly"></canvas>
  </div>
  <div class="card">
    <h2>Spend by Category</h2>
    <canvas id="chart-category"></canvas>
  </div>
  <div class="card">
    <h2>Top Merchants</h2>
    <canvas id="chart-merchants"></canvas>
  </div>
  <div class="card">
    <h2>Income vs Expenses</h2>
    <canvas id="chart-income"></canvas>
  </div>
</div>

<script>
const INR = v => "₹" + Number(v).toLocaleString("en-IN", { maximumFractionDigits: 0 });

const PALETTE = [
  "#4361ee","#f72585","#7209b7","#3a0ca3","#4cc9f0",
  "#f3722c","#f8961e","#90be6d","#43aa8b","#577590",
  "#277da1","#e63946","#a8dadc","#457b9d","#1d3557"
];

let charts = {};

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function monthLabel(iso) {
  const d = new Date(iso);
  return d.toLocaleString("default", { month: "short", year: "2-digit" });
}

function renderAll(data) {
  // ── KPIs ────────────────────────────────────────────────────────────────
  const monthly = data.monthly_spend;
  const totalSpent = monthly.reduce((s, r) => s + Number(r.total_spent), 0);
  const totalTxns  = monthly.reduce((s, r) => s + Number(r.txn_count), 0);
  document.getElementById("kpi-total").textContent  = INR(totalSpent);
  document.getElementById("kpi-txns").textContent   = totalTxns + " transactions";

  const thisMonth = monthly[monthly.length - 1];
  document.getElementById("kpi-month").textContent      = thisMonth ? INR(thisMonth.total_spent) : "—";
  document.getElementById("kpi-month-txns").textContent = thisMonth ? thisMonth.txn_count + " transactions" : "";

  const cats = data.category_spend;
  if (cats.length) {
    document.getElementById("kpi-top-cat").textContent     = cats[0].category;
    document.getElementById("kpi-top-cat-amt").textContent = INR(cats[0].total_spent);
  }
  const merchs = data.top_merchants;
  if (merchs.length) {
    document.getElementById("kpi-top-merch").textContent     = merchs[0].merchant;
    document.getElementById("kpi-top-merch-amt").textContent = INR(merchs[0].total_spent);
  }

  document.getElementById("last-updated").textContent =
    "Updated " + new Date().toLocaleTimeString();

  // ── Chart 1: Monthly Spend ──────────────────────────────────────────────
  destroyChart("monthly");
  charts["monthly"] = new Chart(document.getElementById("chart-monthly"), {
    type: "line",
    data: {
      labels: monthly.map(r => monthLabel(r.month)),
      datasets: [{
        label: "Spend (₹)",
        data: monthly.map(r => Number(r.total_spent)),
        borderColor: "#4361ee",
        backgroundColor: "rgba(67,97,238,0.08)",
        fill: true,
        tension: 0.35,
        pointRadius: 3,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { ticks: { callback: v => "₹" + (v/1000).toFixed(0) + "k" }, grid: { color: "#f0f0f0" } },
        x: { grid: { display: false } }
      }
    }
  });

  // ── Chart 2: Category Doughnut ─────────────────────────────────────────
  destroyChart("category");
  const topCats = cats.slice(0, 10);
  charts["category"] = new Chart(document.getElementById("chart-category"), {
    type: "doughnut",
    data: {
      labels: topCats.map(r => r.category),
      datasets: [{
        data: topCats.map(r => Number(r.total_spent)),
        backgroundColor: PALETTE.slice(0, topCats.length),
        borderWidth: 2,
        borderColor: "#fff",
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "right", labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => " " + INR(ctx.parsed) } }
      }
    }
  });

  // ── Chart 3: Top Merchants (horizontal bar) ────────────────────────────
  destroyChart("merchants");
  const top = merchs.slice(0, 12);
  charts["merchants"] = new Chart(document.getElementById("chart-merchants"), {
    type: "bar",
    data: {
      labels: top.map(r => r.merchant),
      datasets: [{
        label: "Total Spend",
        data: top.map(r => Number(r.total_spent)),
        backgroundColor: PALETTE[0],
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { callback: v => "₹" + (v/1000).toFixed(0) + "k" }, grid: { color: "#f0f0f0" } },
        y: { grid: { display: false }, ticks: { font: { size: 11 } } }
      }
    }
  });

  // ── Chart 4: Income vs Expenses ────────────────────────────────────────
  destroyChart("income");
  const ive = data.income_vs_expense;
  charts["income"] = new Chart(document.getElementById("chart-income"), {
    type: "bar",
    data: {
      labels: ive.map(r => monthLabel(r.month)),
      datasets: [
        {
          label: "Expenses",
          data: ive.map(r => Number(r.expenses)),
          backgroundColor: "rgba(247,37,133,0.75)",
          borderRadius: 3,
        },
        {
          label: "Income",
          data: ive.map(r => Number(r.income)),
          backgroundColor: "rgba(67,170,139,0.75)",
          borderRadius: 3,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        y: { ticks: { callback: v => "₹" + (v/1000).toFixed(0) + "k" }, grid: { color: "#f0f0f0" } },
        x: { grid: { display: false } }
      }
    }
  });
}

async function loadData() {
  try {
    const res = await fetch("/dashboard/data");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderAll(data);
  } catch (err) {
    document.getElementById("last-updated").textContent = "Error: " + err.message;
    console.error(err);
  }
}

loadData();
setInterval(loadData, 60_000);   // auto-refresh every 60 s

function resetStatus() {
  const status = document.getElementById("ingest-status");
  const detail = document.getElementById("ingest-detail");
  status.textContent = "";
  status.className = "";
  detail.style.display = "none";
  detail.innerHTML = "";
}

function showIngestOutcome(res, data, emptyMessage) {
  const status = document.getElementById("ingest-status");
  const detail = document.getElementById("ingest-detail");

  if (!res.ok) {
    // 503 or other HTTP error — show top-level detail
    status.textContent = data.detail || "Server error (" + res.status + ")";
    status.className = "error";
    return;
  }

  if (data.processed_files === 0) {
    status.textContent = data.message || emptyMessage;
    status.className = "ok";
    loadData();
    return;
  }

  const saved = (data.total_saved_debits || 0) + (data.total_saved_credits || 0);
  const failed = data.total_failed || 0;
  const skipped = data.total_skipped || 0;

  if (failed === 0) {
    status.textContent = `${data.processed_files} file(s) — ${saved} saved, ${skipped} skipped`;
    status.className = "ok";
  } else if (failed < data.processed_files) {
    status.innerHTML = `${data.processed_files} file(s) — ${saved} saved, ${skipped} skipped, ${failed} failed &nbsp;<a href="#" style="color:#f8961e" onclick="toggleDetail(event)">see details ▾</a>`;
    status.className = "warn";
  } else {
    status.innerHTML = `All ${data.processed_files} file(s) failed &nbsp;<a href="#" style="color:#f72585" onclick="toggleDetail(event)">see details ▾</a>`;
    status.className = "error";
  }

  // Build per-file detail table
  if (data.files && data.files.length) {
    let html = "<table>";
    for (const f of data.files) {
      if (f.status === "ok") {
        const s = (f.saved_debits || 0) + (f.saved_credits || 0);
        html += `<tr class="ok-row"><td>${f.name}</td><td>✓ ${s} saved, ${f.skipped || 0} skipped</td></tr>`;
      } else {
        const stage = f.stage ? `[${f.stage}] ` : "";
        html += `<tr class="err-row"><td>${f.name}</td><td>✗ ${stage}${f.error || "Unknown error"}</td></tr>`;
        if (f.resolution) {
          html += `<tr><td></td><td class="resolution">↳ ${f.resolution}</td></tr>`;
        }
      }
    }
    html += "</table>";
    detail.innerHTML = html;
    if (failed > 0) detail.style.display = "block";
  }

  loadData();
}

async function ingestFiles() {
  const btn    = document.getElementById("ingest-btn");
  const status = document.getElementById("ingest-status");

  btn.disabled = true;
  btn.textContent = "Ingesting…";
  resetStatus();

  try {
    const res  = await fetch("/ingest", { method: "POST" });
    const data = await res.json();
    showIngestOutcome(res, data, "Nothing to process — inbox/ is empty.");
  } catch (err) {
    status.textContent = "Network error: " + err.message + " — is the server running?";
    status.className = "error";
  } finally {
    btn.textContent = "⬆ Ingest New Files";
    btn.disabled = false;
  }
}

async function uploadFiles(fileList) {
  if (!fileList || fileList.length === 0) return;

  const btn    = document.getElementById("upload-btn");
  const status = document.getElementById("ingest-status");
  const input  = document.getElementById("pdf-file-input");

  btn.disabled = true;
  btn.textContent = "Uploading…";
  resetStatus();

  const form = new FormData();
  for (const f of fileList) form.append("files", f);
  form.append("password", document.getElementById("pdf-password").value);

  try {
    const res  = await fetch("/upload", { method: "POST", body: form });
    const data = await res.json();
    showIngestOutcome(res, data, "No files uploaded.");
  } catch (err) {
    status.textContent = "Network error: " + err.message + " — is the server running?";
    status.className = "error";
  } finally {
    btn.textContent = "📄 Upload PDF";
    btn.disabled = false;
    input.value = "";   // allow re-selecting the same file
  }
}

function toggleDetail(e) {
  e.preventDefault();
  const detail = document.getElementById("ingest-detail");
  detail.style.display = detail.style.display === "none" ? "block" : "none";
}
</script>
</body>
</html>
